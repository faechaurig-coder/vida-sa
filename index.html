<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VIDA S.A.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Fraunces:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="phone">
    <header class="topbar" id="topbar">
      <div class="logo">VIDA S.A.</div>
      <div class="top-meta" id="corp-meta">Tu vida</div>
    </header>

    <div class="perk-chip" id="perk-chip" hidden></div>

    <div class="hud" id="hud" hidden>
      <div class="hud-main">
        <div class="hud-who">
          <span class="hud-avatar" id="hud-avatar"></span>
          <div>
            <strong id="hud-date">ENERO 2026</strong>
            <span class="hud-job" id="hud-age">—</span>
            <span class="hud-job" id="hud-job">—</span>
          </div>
        </div>
        <div class="hud-cash" id="hud-money">$0</div>
      </div>
      <div class="hud-vitals">
        <span class="vital" id="hp-vital" title="Salud"></span>
        <span class="vital" id="hap-vital" title="Felicidad"></span>
        <span class="vital" id="inf-vital" title="Influencia"></span>
        <span class="vital" id="evil-vital" title="Maldad"></span>
      </div>
      <div class="hud-assets">
        <div class="asset-ico" id="home-ico" title="Casa"></div>
        <div class="asset-ico" id="car-ico" title="Coche"></div>
        <div class="asset-ico" id="study-ico" title="Estudios"></div>
        <div class="asset-ico" id="fam-ico" title="Familia"></div>
      </div>
    </div>

    <main id="stage">
      <section class="screen screen-hero">
        <div class="hero-content">
          <h1>¿Qué vida te toca?</h1>
          <p class="lead">Cada decisión cambia tu historia.</p>
          <button type="button" class="btn btn-xl" data-act="seeds">EMPEZAR</button>
        </div>
      </section>
    </main>
    <footer class="fineprint" id="fineprint">Cada decisión cuenta.</footer>

    <div class="overlay juice" id="juice" aria-hidden="true">
      <div class="overlay-card juice-card">
        <p class="juice-years" id="juice-years"></p>
        <div class="juice-char" id="juice-char"></div>
        <div class="juice-hero" id="juice-hero"></div>
        <p class="juice-line" id="juice-line"></p>
        <div class="juice-deltas" id="juice-deltas"></div>
        <p class="juice-hook" id="juice-hook" hidden></p>
        <button type="button" class="btn" id="juice-ok">Continuar</button>
      </div>
    </div>

    <div class="overlay reveal" id="reveal" aria-hidden="true">
      <div class="overlay-card reveal-card">
        <p class="eyebrow" id="reveal-kicker">Esto es tuyo</p>
        <div class="reveal-art" id="reveal-art"></div>
        <h2 id="reveal-title"></h2>
        <p id="reveal-copy"></p>
        <button type="button" class="btn" id="reveal-ok">Continuar</button>
      </div>
    </div>
  </div>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
