<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>VIDA S.A.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="phone">
    <header class="topbar" id="topbar">
      <div class="logo">VIDA S.A.</div>
      <div class="top-meta" id="corp-meta">Tu vida</div>
    </header>

    <div class="perk-chip" id="perk-chip" hidden></div>

    <div class="hud" id="hud" hidden>
      <div class="hud-main">
        <div class="hud-who">
          <span class="hud-face" aria-hidden="true">🧑</span>
          <div>
            <strong id="hud-age">16 años</strong>
            <span class="hud-job" id="hud-job">—</span>
          </div>
        </div>
        <div class="hud-cash" id="hud-money">$0</div>
      </div>
      <div class="life-line" aria-hidden="true">
        <div class="life-track"><i id="life-fill"></i><b id="life-dot"></b></div>
        <div class="life-marks" id="life-marks"></div>
      </div>
      <div class="hud-pills">
        <span class="pill pill-hap">❤️ <b id="hud-hap">—</b></span>
        <span class="pill pill-hp">🫀 <b id="hud-hp">—</b></span>
        <span class="pill" id="home-pill">🏠 <b id="home-tier">—</b></span>
        <span class="pill" id="car-pill">🚗 <b id="car-tier">—</b></span>
        <span class="pill" id="rel-pill">👨‍👩‍👧 <b id="rel-tier">—</b></span>
        <span class="pill pill-debt" id="debt-tier" hidden>📉 deuda</span>
      </div>
    </div>

    <main id="stage"></main>
    <footer class="fineprint" id="fineprint">Cada decisión cuenta.</footer>

    <div class="overlay juice" id="juice" aria-hidden="true">
      <div class="overlay-card juice-card">
        <p class="juice-years" id="juice-years"></p>
        <div class="juice-hero" id="juice-hero"></div>
        <p class="juice-line" id="juice-line"></p>
        <div class="juice-deltas" id="juice-deltas"></div>
        <p class="juice-hook" id="juice-hook" hidden></p>
        <button type="button" class="btn" id="juice-ok">Continuar</button>
      </div>
    </div>

    <div class="overlay reveal" id="reveal" aria-hidden="true">
      <div class="overlay-card reveal-card">
        <p class="eyebrow" id="reveal-kicker">🎁 Esto es tuyo</p>
        <div class="reveal-art" id="reveal-art"></div>
        <h2 id="reveal-title"></h2>
        <p id="reveal-copy"></p>
        <button type="button" class="btn" id="reveal-ok">Continuar</button>
      </div>
    </div>
  </div>
  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
